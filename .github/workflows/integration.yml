name: Shared source integration

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      host_ref:
        description: Compatible parent branch or revision
        default: master
        type: string

permissions:
  contents: read

jobs:
  consumers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout compatible application sources
        uses: actions/checkout@v4
        with:
          repository: piperhex/remoteai
          ref: ${{ inputs.host_ref || vars.REMOTEAI_HOST_REF || 'master' }}
          path: host
      - run: git submodule update --init packages/i18n apps/web apps/native
        working-directory: host
      - name: Checkout shared sources under test
        uses: actions/checkout@v4
        with:
          path: host/shared
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: host/package-lock.json
      - run: npm ci
        working-directory: host
      - run: npm run check:boundaries
        working-directory: host
      - run: npm run check:i18n
        working-directory: host
      - run: npm run build:desktop
        working-directory: host
      - run: npm run export:web && npm ci --prefix apps/web && npm run check:web
        working-directory: host
      - name: Export Native dependencies and regenerate embedded assets
        run: >-
          npm run export:native && npm ci --prefix apps/native &&
          npm --prefix apps/native run generate:assets && npm --prefix apps/native run check
        working-directory: host
      - name: Verify shared browser and protocol logic
        run: >-
          npm exec -w @codex-switch/desktop -- vitest run
          src/remoteChat/packetCipher.test.ts src/remoteChat/downloadRetry.test.ts
          src/remoteChat/streamFrame.test.ts src/pages/codexGui/fontSizePlugin.test.ts
        working-directory: host
      - name: Verify shared native protocol logic
        run: npm --prefix apps/native test -- src/chat/packetCipher.test.ts
        working-directory: host
